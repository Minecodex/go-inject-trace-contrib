name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race -timeout=20m ./...
      - run: go build ./...

  ci-gate:
    name: CI
    if: ${{ always() }}
    needs: ["go"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          optional = set([])
          jobs = json.loads(os.environ["JOB_RESULTS"])
          failed = {
              name: job["result"]
              for name, job in jobs.items()
              if job["result"] != "success"
              and not (name in optional and job["result"] == "skipped")
          }
          if failed:
              print(f"Required CI jobs did not succeed: {failed}")
              sys.exit(1)
          print("All mandatory CI jobs passed.")
          PY
