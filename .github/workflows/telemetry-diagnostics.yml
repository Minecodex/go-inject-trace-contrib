name: Telemetry diagnostics
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      family:
        type: choice
        options: [otelc, skywalking]
        default: otelc
      scenarios:
        description: JSON array of declared scenarios to diagnose
        type: string
        default: '["openaiclient","openaiclientv3","anthropicclient","linodegoclient","awsclient"]'
      go:
        type: choice
        options: ['1.26', '1.25', '1.27']
        default: '1.26'
permissions:
  contents: read
jobs:
  diagnostic:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:diagnostic')
    name: Diagnostic ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        scenario: ${{ fromJSON(inputs.scenarios || '["openaiclient","openaiclientv3","anthropicclient","linodegoclient","awsclient"]') }}
    env:
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v4
        with:
          path: contrib
      - uses: actions/checkout@v4
        with:
          repository: Minecodex/go-inject
          ref: 27abe60389de608a5ed5db794d31165bddad6967
          path: go-inject
      - uses: actions/checkout@v4
        with:
          repository: apache/skywalking-go
          ref: b52ef5762fab16d85704a7d35b8968165d351b85
          path: skywalking-go
      - uses: actions/checkout@v4
        with:
          repository: open-telemetry/opentelemetry-go-compile-instrumentation
          ref: 70b4fe80ffb5032e6cdb79f543da5069ee4133b5
          path: opentelemetry-go-compile-instrumentation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r test/runner/requirements-ci.txt
        working-directory: contrib
      - name: Run both sides of the selected declared scenario
        working-directory: contrib
        env:
          FAMILY: ${{ inputs.family || 'otelc' }}
          SCENARIO: ${{ matrix.scenario }}
          GO_MINOR: ${{ inputs.go || '1.26' }}
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'test/runner')
          import run_all, run_all_otelc
          family, name = os.environ['FAMILY'], os.environ['SCENARIO']
          catalog = run_all_otelc.ORDER if family == 'otelc' else run_all.ORDER
          if name not in catalog:
              raise SystemExit('diagnostic scenario must belong to the declared catalog')
          root = 'scenarios-otelc' if family == 'otelc' else 'scenarios'
          runner = 'run_ab_otelc.py' if family == 'otelc' else 'run_ab.py'
          subprocess.run([sys.executable, '-u', str(Path('test/runner') / runner), '--scenario', str(Path('test') / root / name), '--go', os.environ['GO_MINOR']], check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-${{ inputs.family || 'otelc' }}-${{ matrix.scenario }}-${{ github.sha }}
          path: contrib/test/runner/build/**/actual*.json
          if-no-files-found: warn
